name: xmake

on:
  push:
    branches:
      - 'main'
      - 'refactor-main'
      - 'codex/migrate-pybind-to-nanobind'
    paths-ignore:
      - '.clang-format'
      - '.clangd'
      - '.cursor/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - 'agent_docs/**'
      - '.github/workflows/cmake.yml'
      - '**/CMakeLists.txt'
      - '.github/workflows/docs.yml'
      - CMakePresets.json
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '.clang-format'
      - '.clangd'
      - '.cursor/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - 'agent_docs/**'
      - '.github/workflows/cmake.yml'
      - '**/CMakeLists.txt'
      - '.github/workflows/docs.yml'
      - CMakePresets.json
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-xmake-${{ matrix.os }}
        cancel-in-progress: true

    steps:
      - name: Maximize build space
        if: matrix.os == 'ubuntu-24.04'
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup cuda
        if: matrix.os == 'ubuntu-24.04'
        uses: Jimver/cuda-toolkit@b6fc3a9f3f15256d9d94ffe1254f9c5a2565cde6 # v0.2.30
        id: cuda-toolkit
        with:
          cuda: '12.8.1'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Set up Python for nanobind
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up uv for XMake packaging
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: '0.12.5'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: 3.0.5
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.os }}

      - name: Xmake configure
        if: matrix.os == 'ubuntu-24.04'
        run: |
          xmake config --yes --github_actions=y --python_bindings=y --python_system=y --python_version=3.12.x

      - name: Xmake configure
        if: matrix.os == 'windows-2022'
        run: |
          xrepo env -y -v -b cuda "xmake config --yes --github_actions=y --python_bindings=y --python_system=y --python_version=3.12.x"

      - name: Build libuipc
        run: |
          xmake build uipc_geometry
          xmake build --jobs=3 cuda
          xmake build --all

      - name: Run CPU test suite
        run: |
          xmake run common
          xmake run core
          xmake run geometry

      - name: Package and smoke-test nanobind wheel
        shell: bash
        run: |
          xmake pack -y -o build/xpack pyuipc
          wheel=$(find build/xpack -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --force-reinstall "$wheel"
          python - <<'PY'
          import tempfile
          import sys
          from pathlib import Path

          import uipc
          from uipc import Engine

          package_dir = Path(uipc.__file__).resolve().parent
          build_info = dict(uipc.build_info())
          assert build_info["python_abi"] == "cp312", build_info
          assert build_info["cuda_backend"] is True, build_info
          assert len(list((package_dir / "_native").rglob("*.pyi"))) == 10, package_dir
          assert (package_dir / "py.typed").is_file(), package_dir
          if sys.platform == "linux":
              native_dir = (package_dir / "_native").resolve()
              tbb_paths = {
                  Path(line.rsplit(maxsplit=1)[-1]).resolve()
                  for line in Path("/proc/self/maps").read_text().splitlines()
                  if "/libtbb" in line
              }
              assert tbb_paths, "TBB was not loaded"
              assert all(native_dir in path.parents for path in tbb_paths), tbb_paths
          with tempfile.TemporaryDirectory(prefix="pyuipc-xmake-ci-") as workspace:
              engine = Engine("none", workspace)
              del engine
          print(build_info)
          PY

      - name: Upload XMake nanobind wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyuipc-xmake-nanobind-${{ matrix.os }}
          path: build/xpack/*.whl
          if-no-files-found: error
